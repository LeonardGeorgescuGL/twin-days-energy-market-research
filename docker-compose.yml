services:
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"   # API + dashboard
      - "6334:6334"   # gRPC (îl folosim la benchmark)
    volumes:
      - ./qdrant_storage:/qdrant/storage   # aici rămân datele chiar dacă se opreste containerul
    restart: unless-stopped
